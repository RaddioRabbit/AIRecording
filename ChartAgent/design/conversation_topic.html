<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversation Topic Flow</title>
<style>
:root {
  --bg: #0B0B14;
  --bg-elevated: #12121F;
  --card: #181827;
  --card-hover: #1E1E32;
  --border: #2A2A45;
  --border-subtle: #1F1F35;
  --text: #F1F5F9;
  --text-secondary: #8B95A7;
  --text-tertiary: #5A6480;
  --cyan: #22D3EE;
  --purple: #A78BFA;
  --orange: #FBBF24;
  --green: #4ADE80;
  --red: #FB7185;
  --blue: #60A5FA;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --shadow-md: 0 4px 16px rgba(0,0,0,0.25);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.3);
  --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-main);
  padding: 40px;
  min-height: 100vh;
}
.chart-container {
  max-width: 900px;
  margin: 0 auto;
}
.chart-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #22D3EE 0%, #A78BFA 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.chart-title::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 24px;
  background: linear-gradient(135deg, #22D3EE, #A78BFA);
  border-radius: 9999px;
}
.flow-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 32px;
  box-shadow: var(--shadow-md);
  position: relative;
  overflow: hidden;
}
.flow-wrap::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(34,211,238,0.3), transparent);
}
.flow-subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 24px;
}
.flow-legend {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.flow-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-secondary);
}
.flow-legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
}
.flow-legend-dot.pos { background: rgba(74,222,128,0.6); }
.flow-legend-dot.neu { background: rgba(96,165,250,0.6); }
.flow-legend-dot.neg { background: rgba(251,113,133,0.6); }
.flow-timeline {
  position: relative;
  padding-left: 80px;
}
.flow-timeline::before {
  content: '';
  position: absolute;
  left: 70px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, var(--cyan), var(--purple));
  opacity: 0.3;
}
.flow-segment {
  position: relative;
  margin-bottom: 16px;
}
.flow-time {
  position: absolute;
  left: -80px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  width: 60px;
  text-align: right;
}
.flow-connector {
  position: absolute;
  left: -12px;
  top: 50%;
  transform: translateY(-50%);
  width: 12px;
  height: 12px;
  background: var(--bg);
  border: 2px solid var(--cyan);
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(34,211,238,0.3);
}
.flow-bar {
  height: 40px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  padding: 0 16px;
  position: relative;
  overflow: hidden;
  transition: all var(--transition-base);
  cursor: pointer;
}
.flow-bar:hover {
  transform: translateX(4px);
  box-shadow: var(--shadow-md);
}
.flow-bar.pos { background: linear-gradient(90deg, rgba(74,222,128,0.15), rgba(74,222,128,0.05)); border: 1px solid rgba(74,222,128,0.2); }
.flow-bar.neu { background: linear-gradient(90deg, rgba(96,165,250,0.15), rgba(96,165,250,0.05)); border: 1px solid rgba(96,165,250,0.2); }
.flow-bar.neg { background: linear-gradient(90deg, rgba(251,113,133,0.15), rgba(251,113,133,0.05)); border: 1px solid rgba(251,113,133,0.2); }
.flow-bar-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  z-index: 1;
}
.flow-bar-meta {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-tertiary);
  z-index: 1;
}
.flow-bar-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  border-radius: var(--radius-sm);
  opacity: 0.25;
  transition: width var(--transition-base);
}
.flow-bar.pos .flow-bar-fill { background: var(--green); }
.flow-bar.neu .flow-bar-fill { background: var(--blue); }
.flow-bar.neg .flow-bar-fill { background: var(--red); }
.flow-transition {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0 8px 16px;
  font-size: 11px;
  color: var(--text-tertiary);
}
.flow-transition-arrow {
  color: var(--text-tertiary);
  opacity: 0.5;
}
.flow-speakers {
  display: flex;
  gap: 6px;
  margin-top: 4px;
}
.speaker-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
}
.speaker-badge.a { background: rgba(34,211,238,0.1); color: var(--cyan); }
.speaker-badge.b { background: rgba(167,139,250,0.1); color: var(--purple); }
</style>
</head>
<body>
<div class="chart-container">
  <div class="chart-title">话题情绪流图</div>
  <div class="flow-wrap">
    <div class="flow-subtitle">对话中话题的转移路径与情绪变化 — 横轴为时间推进，颜色为情绪倾向</div>
    <div class="flow-legend">
      <div class="flow-legend-item"><div class="flow-legend-dot pos"></div>积极情绪</div>
      <div class="flow-legend-item"><div class="flow-legend-dot neu"></div>中性情绪</div>
      <div class="flow-legend-item"><div class="flow-legend-dot neg"></div>消极情绪</div>
    </div>
    <div class="flow-timeline">
      <div class="flow-segment">
        <div class="flow-time">00:00</div>
        <div class="flow-connector"></div>
        <div class="flow-bar pos" style="width: 85%;">
          <div class="flow-bar-fill" style="width: 100%;"></div>
          <div class="flow-bar-label">开场寒暄与问候</div>
          <div class="flow-bar-meta">积极 · 2min</div>
        </div>
        <div class="flow-speakers">
          <span class="speaker-badge a">江多拉</span>
          <span class="speaker-badge b">张小萌</span>
        </div>
      </div>
      <div class="flow-transition"><span class="flow-transition-arrow">&#8595;</span> 转入核心话题</div>
      <div class="flow-segment">
        <div class="flow-time">02:15</div>
        <div class="flow-connector"></div>
        <div class="flow-bar neu" style="width: 95%;">
          <div class="flow-bar-fill" style="width: 100%;"></div>
          <div class="flow-bar-label">职场情绪压力的现状讨论</div>
          <div class="flow-bar-meta">中性 · 8min</div>
        </div>
        <div class="flow-speakers">
          <span class="speaker-badge b">张小萌</span>
        </div>
      </div>
      <div class="flow-transition"><span class="flow-transition-arrow">&#8595;</span> 观点深入</div>
      <div class="flow-segment">
        <div class="flow-time">10:30</div>
        <div class="flow-connector"></div>
        <div class="flow-bar pos" style="width: 100%;">
          <div class="flow-bar-fill" style="width: 100%;"></div>
          <div class="flow-bar-label">"情绪无需被治愈，而应被允许存在"</div>
          <div class="flow-bar-meta">积极 · 5min</div>
        </div>
        <div class="flow-speakers">
          <span class="speaker-badge a">江多拉</span>
          <span class="speaker-badge b">张小萌</span>
        </div>
      </div>
      <div class="flow-transition"><span class="flow-transition-arrow">&#8595;</span> 话题发散</div>
      <div class="flow-segment">
        <div class="flow-time">15:45</div>
        <div class="flow-connector"></div>
        <div class="flow-bar neu" style="width: 70%;">
          <div class="flow-bar-fill" style="width: 100%;"></div>
          <div class="flow-bar-label">自我边界与人际关系</div>
          <div class="flow-bar-meta">中性 · 4min</div>
        </div>
        <div class="flow-speakers">
          <span class="speaker-badge b">张小萌</span>
        </div>
      </div>
      <div class="flow-transition"><span class="flow-transition-arrow">&#8595;</span> 情感共鸣</div>
      <div class="flow-segment">
        <div class="flow-time">20:00</div>
        <div class="flow-connector"></div>
        <div class="flow-bar pos" style="width: 90%;">
          <div class="flow-bar-fill" style="width: 100%;"></div>
          <div class="flow-bar-label">生活态度与价值观念的分享</div>
          <div class="flow-bar-meta">积极 · 6min</div>
        </div>
        <div class="flow-speakers">
          <span class="speaker-badge a">江多拉</span>
          <span class="speaker-badge b">张小萌</span>
        </div>
      </div>
      <div class="flow-transition"><span class="flow-transition-arrow">&#8595;</span> 收尾</div>
      <div class="flow-segment">
        <div class="flow-time">26:30</div>
        <div class="flow-connector"></div>
        <div class="flow-bar pos" style="width: 60%;">
          <div class="flow-bar-fill" style="width: 100%;"></div>
          <div class="flow-bar-label">总结与感谢</div>
          <div class="flow-bar-meta">积极 · 2min</div>
        </div>
        <div class="flow-speakers">
          <span class="speaker-badge a">江多拉</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
